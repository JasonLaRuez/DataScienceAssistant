[project]
name = "dsa"
version = "0.1.0"
description = "Toolkit for moving quickly through a tabular ML workflow in Jupyter, pausing only at decisions a human should make."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "JasonLaRuez", email = "jasonlaruez@gmail.com" }]

# Runtime dependencies. Kept deliberately small: the stack is pandas/NumPy/scikit-learn/
# matplotlib plus seaborn for plotting defaults, two gradient-boosting libraries for the
# step-5 model bake-off, and the readers needed for whatever Kaggle hands back.
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "kagglehub>=0.3",
    "pyarrow>=17",      # parquet
    "openpyxl>=3.1",    # xlsx
]

[dependency-groups]
# Not installed into a consumer's environment; present in the dev environment only.
dev = [
    "pytest>=8.3",
    "nbstripout>=0.7",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
